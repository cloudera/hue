name: Python 3 CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  hue-build-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit title format
        run: |
          ./tools/ci/check_for_commit_message.sh

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          # This path is specific to Ubuntu
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('desktop/core/generate_requirements.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Setup node 22 and cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build Hue
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential asciidoc libkrb5-dev libldap2-dev libsasl2-dev libxslt-dev libsasl2-modules-gssapi-mit libsnappy-dev libgdbm-dev

          export PYTHON_VER=python3.11
          export SKIP_PYTHONDEV_CHECK=true
          export ROOT=$PWD
          make apps test_prep

      - name: Run unit tests
        run: |
          ./build/env/bin/pytest

      - name: Run python lint check
        run: |
          PYTHONWARNINGS=always ./build/env/bin/hue runruff check

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: hue-reports
          path: ./reports
